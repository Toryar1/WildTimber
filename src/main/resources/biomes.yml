# ─────────────────────────────────────────────────────────────────────────────
# biomes.yml — Configuration des biomes pour WildTimber
# ─────────────────────────────────────────────────────────────────────────────

# COMPRÉHENSION DES MODULES DE DÉTECTION :
# WildTimber utilise 3 modules de détection complémentaires pour gérer les arbres :

# 1. MODULE PRINCIPAL (BFS 26-way + Goulots) :
# Analyse le tronc et la canopée en 26-way (diagonales incluses, idéal pour les
# arbres customisés avec branches diagonales). S'il détecte plusieurs troncs,
# il tente de séparer les arbres fusionnés en coupant de minces jonctions
# (goulots) selon les critères de taille et coût configurés (trees.*).

# 2. MODULE 6BIS (BFS 6-way) :
# Si la détection principale (26-way) englobe un cluster d'arbres trop géant
# dépassant les limites autorisées (tree_too_large), le plugin relance
# immédiatement le scan en connectivité 6-way stricte (faces adjacentes uniquement,
# sans diagonales). Cela permet de séparer automatiquement les arbres qui ne
# se touchent que par les coins sans bloquer la coupe.

# 3. MODULE FALLBACK (Secours Cylindrique) :
# Si la séparation par goulots échoue car les arbres sont trop imbriqués,
# le plugin se rabat sur cet algorithme pour découper une portion cylindrique
# autour du tronc frappé, basée sur la densité locale de bûches et feuilles.
# (Note: ce module correspond à l'algorithme de secours cylindrique).
# ─────────────────────────────────────────────────────────────────────────────

# Chaque section définit les blocs reconnus comme "tronc", "feuille" ou
# "attachment" dans un biome donné, ainsi que les drops additionnels.

# Clé spéciale DEFAULT : utilisée pour tout biome non listé explicitement.
# Il est recommandé d'y mettre tous les types d'arbres vanilla afin de couvrir
# les biomes personnalisés et les datapack.

# ─── Structure d'une entrée de biome ─────────────────────────────────────────
# NOM_DU_BIOME:
#   enabled: true                # Activer ou non la détection/coupe de WildTimber pour ce biome (true/false)
#   min-logs: 1                  # Nombre minimum de bûches pour reconnaître un arbre
#                                # Exemple : min-logs: 3 → ignore les buissons
#   min-leaf-like: 0             # Nombre minimum de feuilles requises
#                                # Exemple : min-leaf-like: 5 → ignore les souches nues
#   max-logs: 1024               # Nombre maximum de bûches (optionnel, hérite du config.yml si absent)
#   max-blocks: 4096             # Nombre maximum total de blocs (optionnel, hérite du config.yml si absent)
#   max-radius-xz: 16            # Rayon horizontal maximum du scan (optionnel, hérite du config.yml si absent)
#   max-height-y: 64             # Hauteur verticale maximum du scan (optionnel, hérite du config.yml si absent)
#   protection-belt-radius: 4    # Rayon (en blocs) de protection autour des troncs voisins
#                                # Exemple : 2 → ceinture fine, 6 → large protection
#   leaf-decay-range-xz: 6       # Distance max horizontale pour le scan/decay des feuilles (optionnel, hérite du config.yml)
#   leaf-decay-range-y: 8        # Distance max verticale pour le scan/decay des feuilles (optionnel, hérite du config.yml)
#   isolated-logs-rule: true     # Activer/désactiver la règle des bûches isolées dans la canopée (optionnel)
#   orphan-leaves-cleanup: true  # Activer/désactiver le nettoyage des feuilles orphelines (optionnel)
#   orphan-leaves-radius: 5      # Rayon de nettoyage des feuilles orphelines (optionnel)
#   isolated-logs-radius: 6      # Rayon pour chercher des bûches orphelines post-abattage (optionnel)
#   isolated-log-max: 4          # Taille max d'un groupe de bûches pour être considéré orphelin (optionnel)
#   allow-non-rooted-start: true # Autoriser ou non le scan sur une bûche non enracinée (optionnel)
#   max-root-search-depth: 16    # Profondeur max de recherche vers le bas pour le tronc réel (optionnel)
#   fill-mode: HOLE_DETECTOR     # Mode de rebouchage spécifique à ce biome (HOLE_DETECTOR, LEGACY, NONE)
#   fill-radius-extra: 0         # Blocs supplémentaires horizontalement autour de la bounding box XZ à inclure
#   elephant-factor: 1.5         # Facteur pied d'éléphant pour ce biome
#   6way-max-logs: 2048          # Budget max pour le BFS 6-way restreint (Module 6bis) (optionnel)
#   canopy-cleanup-enabled: true # Activer la phase de nettoyage canopée post-coupe (optionnel)
#   canopy-cleanup-padding: 6    # Padding (blocs) de la bounding box pour le canopy cleanup (optionnel)
#   root-replacement-enabled: true # Activer le remplacement des racines sous terre pour ce biome (optionnel)
#   root-replacement-material: DIRT # Matériau de remplacement des racines pour ce biome (Ex: DIRT, NETHERRACK...)
#   log-blocks:                  # Liste des blocs considérés comme "tronc"
#     - OAK_LOG                  # Exemple : OAK_LOG, MANGROVE_LOG, CRIMSON_STEM...
#   leaf-blocks:                 # Liste des blocs considérés comme "feuille"
#     - OAK_LEAVES               # Exemple : OAK_LEAVES, NETHER_WART_BLOCK...
#   attachments:                 # Blocs attachés (supprimés avec l'arbre, sans drop si non coupés aux cisailles)
#     - VINE                     # Exemple : VINE, COCOA, MANGROVE_PROPAGULE...
#   extra-drops:
#     enabled: false             # true pour activer les drops additionnels
#     entries:
#       - item: COCOA_BEANS      # Matériau à dropper (nom Bukkit Material)
#         chance: 0.05           # Probabilité par feuille (0.0 = jamais, 1.0 = toujours)
#         min: 1                 # Quantité minimum par drop
#         max: 2                 # Quantité maximum par drop
#
#   # Configuration locale du module de secours cylindrique (Module Fallback / Secours)
#   fallback:
#     enabled: true              # Activer ou non le fallback pour ce biome
#     max-blocks: 2048           # Nb max de blocs du cluster pour autoriser le fallback
#     trunk-core-radius: 2       # Rayon horizontal pour chercher le tronc principal
#     trunk-min-height: 3        # Nb min de bûches pour considérer une colonne comme tronc
#     max-radius: 10             # Rayon horizontal maximal du cylindre de secours
#     min-density: 0.1           # Densité minimale requise pour continuer le cylindre
#     ring-step: 2               # Largeur des anneaux concentriques

# ─── Clés multi-biomes ────────────────────────────────────────────────────────
# Vous pouvez grouper plusieurs biomes sous une seule config en séparant
# les noms par des virgules. Tous les biomes listés partageront la même config :

# 'WINTER_MOUNTAIN_FOREST,TERRALOST_AMETHYST_RAINFOREST':
#   min-logs: 2
#   leaf-decay-range-xz: 8
#   leaf-decay-range-y: 12
#   log-blocks:
#     - SPRUCE_LOG
#     - OAK_LOG
#   leaf-blocks:
#     - SPRUCE_LEAVES
#     - OAK_LEAVES

# ─── Suffixes numériques ──────────────────────────────────────────────────────
# Si un biome a un numéro en suffixe (ex: TERRALOST_AMETHYST_RAINFOREST1),
# et qu'aucune config exacte n'existe pour ce nom, le plugin utilisera
# automatiquement la config de TERRALOST_AMETHYST_RAINFOREST (sans numéro).
# Pour différencier un biome numéroté, créez une entrée spécifique :

# TERRALOST_AMETHYST_RAINFOREST3:
#   min-logs: 5
#   # Cette config sera utilisée uniquement pour le biome 3

# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# biomes.yml — Configuration WildTimber pour Iris Overworld
# Généré depuis IrisDimensions/overworld (branche master)
# Organisé par famille climatique, mutualisé par profil d'arbres communs
# Tout biome garde volontairement les réglages pertinents visibles pour faciliter
# les futures retouches manuelles, même quand une valeur pourrait être héritée.
# ═══════════════════════════════════════════════════════════════════════════════

# FAMILLES :
#  ❄️  FROID      → frozen/ + tundra/ (épicéa, redwood Iris = DARK_OAK_WOOD)
#  🌿  TEMPÉRÉ    → temperate/ + vanilla tempérés (chêne, bouleau, sakura/cerisier)
#  🌊  MARÉCAGE   → swamp/ + vanilla humides (dark oak, champignon, mangrove, jungle)
#  🌴  TROPICAL   → tropical/ + vanilla jungle (jungle)
#  🌵  ARIDE      → hot/ + mesa/ + savanna/ + vanilla secs (acacia, sans arbres)
#  🏔️   MONTAGNE   → mountain/ + vanilla alpins (épicéa, chêne+épicéa)
#  🍄  CHAMPIGNON → mushroom/ (champignon géant uniquement)
#  🔮  SPÉCIAUX   → terralost/ + estranged/ (divers)
#  ☠️  NETHER     → forêts nether
#
# NOTE BLOCS CUSTOM IRIS :
#  "Redwood Iris" (mixed/tredwood*) → DARK_OAK_WOOD + DARK_OAK_LOG
#  "Magic/Dotree"  (mixed/dotree*)  → DARK_OAK_LOG
#  "Sakura Iris"   (sakura/*)       → CHERRY_LOG (vanilla 1.20+)
#  "Willow"        (darkoak/willow*)→ DARK_OAK_LOG
#  "Sproak"        (mountain)       → OAK_LOG + SPRUCE_LOG
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# DEFAULT — Fallback universel
# Garde une base sûre pour tout biome non listé explicitement.
# Réglage plutôt conservateur pour éviter les faux positifs sur buissons.
# ───────────────────────────────────────────────────────────────────────────────
DEFAULT:
  enabled: true
  min-logs: 2
  min-leaf-like: 3
  max-logs: 1024
  max-blocks: 4096
  max-radius-xz: 16
  max-height-y: 64
  protection-belt-radius: 4
  leaf-decay-range-xz: 6
  leaf-decay-range-y: 8
  allow-diagonal-logs: true
  allow-diagonal-leaves: true
  leaf-decay-scaling-logs: 100
  leaf-decay-scaling-xz-bonus: 1
  leaf-decay-scaling-y-bonus: 2
  isolated-logs-rule: true
  orphan-leaves-cleanup: true
  orphan-leaves-radius: 5
  isolated-logs-radius: 6
  isolated-log-max: 4
  allow-non-rooted-start: true
  max-root-search-depth: 16
  6way-max-logs: 768
  canopy-cleanup-enabled: true
  canopy-cleanup-padding: 12
  root-replacement-enabled: true
  root-replacement-material: DIRT
  log-blocks:
    - OAK_LOG
    - OAK_WOOD
    - STRIPPED_OAK_LOG
    - STRIPPED_OAK_WOOD
    - SPRUCE_LOG
    - SPRUCE_WOOD
    - STRIPPED_SPRUCE_LOG
    - STRIPPED_SPRUCE_WOOD
    - BIRCH_LOG
    - BIRCH_WOOD
    - STRIPPED_BIRCH_LOG
    - STRIPPED_BIRCH_WOOD
    - JUNGLE_LOG
    - JUNGLE_WOOD
    - STRIPPED_JUNGLE_LOG
    - STRIPPED_JUNGLE_WOOD
    - ACACIA_LOG
    - ACACIA_WOOD
    - STRIPPED_ACACIA_LOG
    - STRIPPED_ACACIA_WOOD
    - DARK_OAK_LOG
    - DARK_OAK_WOOD
    - STRIPPED_DARK_OAK_LOG
    - STRIPPED_DARK_OAK_WOOD
    - MANGROVE_LOG
    - MANGROVE_WOOD
    - STRIPPED_MANGROVE_LOG
    - STRIPPED_MANGROVE_WOOD
    - MANGROVE_ROOTS
    - MUDDY_MANGROVE_ROOTS
    - CHERRY_LOG
    - CHERRY_WOOD
    - STRIPPED_CHERRY_LOG
    - STRIPPED_CHERRY_WOOD
    - PALE_OAK_LOG
    - PALE_OAK_WOOD
    - STRIPPED_PALE_OAK_LOG
    - STRIPPED_PALE_OAK_WOOD
    - BAMBOO_BLOCK
    - STRIPPED_BAMBOO_BLOCK
    - GRAY_TERRACOTTA
    - MUSHROOM_STEM
    - CRIMSON_STEM
    - CRIMSON_HYPHAE
    - WARPED_STEM
    - WARPED_HYPHAE
  leaf-blocks:
    - OAK_LEAVES
    - SPRUCE_LEAVES
    - BIRCH_LEAVES
    - JUNGLE_LEAVES
    - ACACIA_LEAVES
    - DARK_OAK_LEAVES
    - MANGROVE_LEAVES
    - CHERRY_LEAVES
    - PALE_OAK_LEAVES
    - RED_MUSHROOM_BLOCK
    - BROWN_MUSHROOM_BLOCK
    - AZALEA_LEAVES
    - FLOWERING_AZALEA_LEAVES
    - NETHER_WART_BLOCK
    - WARPED_WART_BLOCK
  attachments:
    - VINE
    - COCOA
    - BEE_NEST
    - MOSS_CARPET
    - GLOW_LICHEN
    - MANGROVE_PROPAGULE
    - AZALEA
    - FLOWERING_AZALEA
    - SHROOMLIGHT
