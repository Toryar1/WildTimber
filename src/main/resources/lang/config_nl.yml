# ─────────────────────────────────────────────────────────────────────────────
# config.yml — WildTimber Hauptkonfiguration
# ─────────────────────────────────────────────────────────────────────────────
#
# ÜBERSICHT DER ERKENNUNGSMODULE:
# WildTimber verwendet 3 komplementäre Erkennungsmodule zur Baumverwaltung:
#
# 1. HAUPTMODUL (BFS 26-Wege + Engpässe):
#    Analysiert Stamm und Krone in 26-Wegen (Diagonalen eingeschlossen, ideal für
#    benutzerdefinierte Bäume mit diagonalen Ästen). Bei mehreren Stämmen versucht
#    es, zusammengewachsene Bäume durch Schneiden dünner Verbindungen (Engpässe)
#    gemäß den Größen- und Kostenkriterien unter trees.* zu trennen.
#
# 2. 6-WEGE-MODUL (BFS 6-Wege):
#    Falls die Haupterkennung (26-Wege) einen zu großen Cluster erfasst,
#    startet das Plugin sofort neu mit strikter 6-Wege-Konnektivität.
#    Dies trennt Bäume, die sich nur an den Ecken berühren.
#
# 3. FALLBACK-MODUL (Zylinder-Fallback):
#    Wenn die Trennung fehlschlägt, schneidet das Plugin einen zylindrischen
#    Teil um den getroffenen Stamm basierend auf lokaler Dichte.
# ─────────────────────────────────────────────────────────────────────────────

plugin:
  enabled: true          # true = Plugin aktiv | false = global deaktiviert
  # Sprachcode des Plugins (en, fr, de, es, pt_BR, nl, pl, ru, zh_CN, it)
  language: "en"
  # Auf true setzen für Debug-Logs in der Konsole
  debug: false           # Beispiel: debug: true -> zeigt Scans in der Konsole an
  # Auf true setzen für detaillierte Blatt-Drop-Logs
  verbose-debug: false

worlds:
  # Liste der Welten, in denen WildTimber deaktiviert ist.
  # Wenn leer, ist das Plugin standardmäßig auf allen Welten aktiv.
  disabled:
    - "ignored_world_example"

health:
  # Globaler HP-Koeffizient für Bäume.
  # Gesamt-HP = Summe der Stammgewichte * base-coefficient
  # Beispiel: 1.0 = normal | 2.0 = Baum doppelt so widerstandsfähig
  base-coefficient: 1.0

  # Inaktivitätsverzögerung (in Sekunden) bevor die Regeneration beginnt.
  # Beispiel: 180 = 3 Minuten Inaktivität -> Regeneration startet
  inactivity-delay-seconds: 180

  regen:
    # true = HP regeneriert, wenn der Baum seit inactivity-delay-seconds nicht getroffen wurde
    enabled: true        # Beispiel: false -> Baum behält seinen Schaden unbegrenzt

    # Prozentsatz der maximalen HP, der pro Regenerationstick wiederhergestellt wird.
    # Beispiel: 10.0 = 10% pro Schritt -> vollständige Erholung in 10 Schritten
    percent-per-step: 10.0

    # Intervall zwischen Regenerationsticks, in Sekunden.
    # Beispiel: 60 = 1 Regenerationsschritt alle 60 Sekunden
    step-seconds: 60

  # Visuelle Anzeige des Schadensfortschritts am Zielstamm aktivieren (Rissstufen)
  visual-tree-health-enabled: true

trigger:
  # Auslösemodus. Derzeit wird nur RIGHT_CLICK_AXE unterstützt.
  mode: "RIGHT_CLICK_AXE"

  # true = Hinweisnachricht an Spieler senden, die einen Stamm ohne Erfassung schlagen
  send-hint-message: true   # Beispiel: false -> keine Hinweistexte

  # Verzögerung (in Sekunden) zwischen zwei Hinweistexten für denselben Spieler.
  # Beispiel: 60 = ein Hinweis pro Minute pro Spieler
  hint-cooldown-seconds: 60

  # Mindestverzögerung zwischen zwei gezählten Klicks (in Millisekunden)
  # Beispiel: 350 -> maximal ein Klick alle 350ms
  click-cooldown-ms: 350

durability:
  # Grundschaden am Baum pro Klick je nach verwendetem Werkzeug.
  # Spezialschlüssel AIR (oder HAND) = leere Hand.
  # Beispiel: DIAMOND_AXE: 5.0 -> Diamantaxt richtet 5 HP pro Klick an
  multipliers:
    WOODEN_AXE: 1.0       # Holzaxt
    STONE_AXE: 1.5        # Steinaxt
    IRON_AXE: 2.0         # Eisenaxt
    GOLDEN_AXE: 2.5       # Goldaxt
    DIAMOND_AXE: 3.5      # Diamantaxt
    NETHERITE_AXE: 5.0    # Netheritaxt
    AIR: 0.5              # Leere Hand (HAND -> nutzt intern AIR)

  # Zusätzlicher Schaden pro Verzauberungsstufe.
  enchantments:
    # Bonus-Schaden pro Effizienz-Stufe.
    # Beispiel: 0.5 -> Effizienz III fügt 3 * 0.5 = 1.5 extra HP hinzu
    efficiency: 0.5

    # Bonus-Schaden pro Schärfe-Stufe.
    # Beispiel: 0.3 -> Schärfe V fügt 5 * 0.3 = 1.5 extra HP hinzu
    sharpness: 0.3

  # Interner Effizienzmultiplikator.
  efficiency-level-multiplier: 0.2

  extra-loss:
    # true = Werkzeug verliert beim Fällen zusätzliche Haltbarkeit
    enabled: true          # Beispiel: false -> keine zusätzliche Abnutzung

    # Zusätzliche Haltbarkeitspunkte, die pro Schlag verloren gehen.
    # Beispiel: 1 = 1 zusätzlicher Haltbarkeitspunkt pro Klick
    points-per-interval: 1

    # Wahrscheinlichkeit (0-100) für zusätzlichen Haltbarkeitsverlust.
    # Beispiel: 50 = 50% Chance auf Haltbarkeitsverlust
    chance-percent: 100

limits:
  # Baumerkennungs-Voreinstellung:
  # - CUSTOM  : Verwendet alle unten definierten Regeln. (Empfohlen)
  # - VANILLA : Ignoriert untenstehende Grenzen und nutzt Vanilla-Standards
  preset: "CUSTOM"

  # Ob Blacklist-Blöcke (Bauwerke) das Fällen verhindern.
  # true (Standard): schützt Spielerbauten.
  # false: ignoriert Bauschutz beim Fällen.
  blacklist-enabled: true

  # true = Baum muss Bodenkontakt haben (erfasst), um gefällt zu werden.
  # false = schwimmende Bäume werden akzeptiert.
  tree-contact-required: true

  # Maximale Anzahl an Stämmen pro Baum.
  # Beispiel: 1024 -> verweigert Bäume mit mehr als 1024 Stämmen
  max-logs: 1024

  # Maximale Gesamtzahl an Blöcken (Stämme + Blätter).
  # Beispiel: 4096 -> globales Limit von 4096 Blöcken pro Baum
  max-blocks: 4096

  # Maximaler horizontaler Radius (XZ) des Scans vom Stamm.
  # Beispiel: 16 -> sucht Stämme bis 16 Blöcke horizontale Distanz
  max-radius-xz: 16

  # Maximale vertikale Höhe (Y) des Scans vom geklickten Block.
  # Sollte generell größer als max-radius-xz sein.
  # Beispiel: 64 -> sucht Stämme bis 64 Blöcke Höhe
  max-height-y: 64

  # Maximale Anzahl verbundener Nicht-Baumblöcke.
  max-connected-non-tree-blocks: 50

  # Maximale BFS-Reichweite für Blatterkennung und Zerfall.
  # - leaf-decay-range-xz: maximaler horizontaler Radius des Blattscans.
  # - leaf-decay-range-y : maximaler vertikaler Radius des Blattscans.
  # Beispiel: xz: 6, y: 8 -> sucht Blätter bis 6 Blöcke horiz. und 8 vert.
  leaf-decay-range-xz: 6
  leaf-decay-range-y: 8

  # Diagonale Erkennung erlauben (26 Richtungen statt 6)
  # - allow-diagonal-logs: verbindet Stämme diagonal
  # - allow-diagonal-leaves: verbindet Blätter diagonal
  allow-diagonal-logs: true
  allow-diagonal-leaves: true

  # Faktoren für dynamische Radiuserhöhung bei großen Bäumen:
  # Alle X gefällten Stämme +Y zum XZ-Radius und +Z zum Y-Radius hinzufügen.
  # Auf 0 setzen zum Deaktivieren.
  leaf-decay-scaling-logs: 100
  leaf-decay-scaling-xz-bonus: 1
  leaf-decay-scaling-y-bonus: 2

  # Blöcke, die nach dem Fällen aufgeräumt werden.
  # Beispiel: SNOW, HONEYCOMB_BLOCK, HONEY_BLOCK...
  cleanup-floating-blocks:
    - "SNOW"
    - "HONEYCOMB_BLOCK"
    - "HONEY_BLOCK"
    - "DARK_OAK_FENCE"
    - "DARK_OAK_FENCE_GATE"

  # Ertragsmultiplikator für Stämme beim Fällen.
  # Gedroppte Stämme = ceil(Stämme_gesamt * log-yield-multiplier)
  # Beispiel: 0.75 -> ein 100-Stamm-Baum ergibt 75 Stämme
  log-yield-multiplier: 0.75

  # Anzahl der Astsuch-Iterationen im Blätterdach.
  # Sucht iterativ nach Stämmen neben Blättern.
  # Erhöhen, wenn Stämme bei großen Bäumen übrig bleiben.
  # Beispiel: 5 -> 5 Durchgänge (empfohlener Standard)
  #          10 -> präziser für sehr komplexe Bäume
  max-branch-discovery-iterations: 5

  # Maximale Größe eines isolierten verwaisten Clusters.
  # Ein verwaister Cluster berührt weder Boden noch Hauptbaum.
  # Wenn klein genug, wird er als Teil des Baumes betrachtet.
  # Beispiel: 10 -> absorbiert Fragmente <= 10 Blöcke
  max-orphan-cluster-size: 10

  # Regel für isolierte Stämme im Blätterdach.
  # true = betrachtet diese Stämme als Teil des Hauptbaumes.
  isolated-logs-rule: true

  # Optionen zum Aufräumen einzelner Blätter nach dem Fällen.
  orphan-leaves-cleanup:
    # true = räumt Blätter ohne Stamm in der Nähe automatisch auf
    enabled: true
    # Scanradius um den gefällten Baum
    radius: 5

  # Optionen zum Ersetzen unterirdischer Wurzeln (Erde statt Luft)
  root-replacement:
    # true = aktiviert Ersatz unterirdischer Wurzeln durch feste Blöcke
    enabled: true
    # Ersatzmaterial (Bukkit Materialname)
    # Beispiel: DIRT, COARSE_DIRT, NETHERRACK...
    material: "DIRT"

  # Radius um das Baumvolumen zur Suche verwaister Stämme.
  isolated-logs-radius: 6

  # Maximale Anzahl verbundener Stämme für verwaiste Gruppen.
  isolated-log-max: 4

  # true = erlaubt Scan-Start an nicht verwurzelten Stämmen.
  # Das Plugin steigt vertikal ab, um den echten Stamm zu finden.
  allow-non-rooted-start: false

  # Maximale Suchtiefe nach unten für verwurzelte Stämme.
  max-root-search-depth: 16

  # Maximales Budget für den eingeschränkten 6-Wege-BFS
  # Ermöglicht das Fällen riesiger Bäume ohne vollen Scan
  6way-max-logs: 2048

  # Blätterdach-Aufräumphase nach dem Fällen aktivieren
  canopy-cleanup-enabled: true

  # Randabstand um den Baum zum Scannen verwaister Blätter
  canopy-cleanup-padding: 12

  # Anzahl verarbeiteter Blätter pro Tick (Standard: 64)
  leaves-persistence-batch-size: 64

# ─────────────────────────────────────────────────────────────────────────────
# Anti-Cheat
# ─────────────────────────────────────────────────────────────────────────────
anti-cheat:
  # true = Anti-Cheat-Erkennung aktivieren
  enabled: true
  # Mindestabklingzeit zwischen zwei Klicks (in ms)
  min-click-interval-ms: 100
  # Erforderliche Mindeständerung des Blickwinkels (in Grad)
  min-look-change-degrees: 0.1
  # Maximale Anzahl aufeinanderfolgender Klicks mit zu regelmäßigem Intervall
  max-regular-clicks: 8

# ─────────────────────────────────────────────────────────────────────────────
# Mehrfachstamm-Trennung (Trennung benachbarter Bäume)
# ─────────────────────────────────────────────────────────────────────────────
trees:
  # Mindestanzahl mit dem Boden verbundener Stämme für einen Stamm.
  # Beispiel: 4 -> ein Stamm muss mindestens 4 Blöcke haben
  min-logs-rooted: 4

  # Mindestanzahl isolierter Stämme für virtuellen Stamm.
  # Allows treating small floating groups as mini-trees.
  # Beispiel: 3 -> Gruppe von 3+ schwimmenden Stämmen wird als Baum behandelt
  min-logs-isolated: 3

  # Maximale Dicke (in Stämmen) eines Engpasses zwischen Bäumen.
  # Bei mehr Stämmen werden die Bäume nicht getrennt.
  # Beispiel: 4 -> Verbindung von <= 4 Stämmen ist trennbarer Engpass
  max-bridge-section-size: 4

  # Maximale Kosten eines zulässigen Engpasses.
  # Je höher und breiter eine Verbindung, desto höher die Kosten.
  max-bridge-cost: 20.0

  # Höhengewichtungskoeffizient für Schnitte.
  # Beispiel: 0.1 -> leichter Vorteil für hohe Schnitte
  height-weight-alpha: 0.1

  # Maximaler Radius um den Zielstamm zur Verbindungs-Suche.
  bridge-search-radius: 16

# ─────────────────────────────────────────────────────────────────────────────
# Performance (schrittweiser Schnitt für sehr große Bäume)
# ─────────────────────────────────────────────────────────────────────────────
performance:
  # true = schrittweisen Schnitt für große Bäume aktivieren
  staged-cut-enabled: true

  # Ab dieser Gesamtblockanzahl wird in mehreren Durchgängen gefällt.
  # Beispiel: 256 -> Bäume über 256 Blöcken werden schrittweise gefällt
  staged-cut-min-blocks: 256

  # Höhe (in Blöcken) einer zerstörten Scheibe pro Schritt.
  # Beispiel: 1 -> 1 Y-Ebene pro Durchgang
  staged-cut-slice-height: 1

  # Verzögerung zwischen Scheiben (in Server-Ticks, 20 Ticks = 1 Sekunde).
  # Beispiel: 5 -> 1 Scheibe alle 5 Ticks (4 pro Sekunde)
  staged-cut-interval-ticks: 5

# ─────────────────────────────────────────────────────────────────────────────
# Unterirdische Wurzelverfüllung
# ─────────────────────────────────────────────────────────────────────────────
roots:
  # true = ersetzt unterirdische Stämme durch feste Blöcke statt Luft.
  backfill-enabled: true

  # Standardblock, wenn kein fester Nachbar gefunden wird.
  backfill-block: "DIRT"

  # Verfüllmodus: HOLE_DETECTOR (empfohlen), LEGACY oder NONE
  fill-mode: "HOLE_DETECTOR"

  # Maximale Scan- und Verfülltiefe
  fill-depth: 16

  # Zusätzliche Blöcke horizontal um den Stamm
  fill-radius-extra: 0

  # Natürlicher Verfüllungs-Erweiterungsfaktor im Zentrum (Elefantenfuß)
  elephant-factor: 1.5

  # Maximal zulässige Steigung zwischen benachbarten Spalten
  # Niedrigerer Wert = flachere Oberfläche
  max-slope: 2

  # Anzahl der für IDW-Interpolation genutzten Nachbarn (empfohlen: 8)
  idw-neighbors: 8

  # [LEGACY] Maximale Verfülltiefe.
  max-backfill-depth: 6

  # [LEGACY] Randabstand an Blöcken über den Stamm hinaus
  root-fill-padding: 2

  # [LEGACY] Tiefenabstand unter dem untersten Stamm
  root-fill-depth-padding: 2

# ─────────────────────────────────────────────────────────────────────────────
# Zylindrischer Fallback-Algorithmus (Fallback-Modul)
# ─────────────────────────────────────────────────────────────────────────────
fallback:
  # true = zylindrischen Fallback-Scan bei Fehlschlag aktivieren
  enabled: true

  # Maximale Blockanzahl, für die der Fallback gilt.
  # Darüber hinaus wird massives Fällen abgelehnt.
  max-blocks: 2048

  # Horizontaler Radius zur Suche nach Stammkernspalten.
  # Beispiel: 1 -> Spalten direkt neben dem getroffenen Stamm
  trunk-core-radius: 1

  # Mindestanzahl aufeinanderfolgender vertikaler Stämme.
  trunk-min-height: 3

  # Maximaler horizontaler Radius im Fallback-Modus.
  # Beispiel: 8 -> Zylinder mit Radius 8 um den Stamm
  max-radius: 8

  # Mindestdichte (0.0 bis 1.0) zur Einbeziehung eines Rings.
  # Fällt die Dichte darunter, stoppt die Erweiterung.
  # Beispiel: 0.10 -> mindestens 10% Baumblöcke
  min-density: 0.10

  # Breite der Distanzringe (in Blöcken).
  ring-step: 1

# ─────────────────────────────────────────────────────────────────────────────
# Drops von entfernten Blättern
# ─────────────────────────────────────────────────────────────────────────────
leaf-drops:
  enabled: true          # Blatt-Drops aktivieren/deaktivieren
  sapling-chance: 0.05   # 5% pro Blatt (NICHT ÄNDERN)
  stick-chance: 0.02     # 2% pro Blatt (NICHT ÄNDERN)
  apple-chance: 0.005    # 0.5% (nur Eiche + Schwarzeiche) (NICHT ÄNDERN)
