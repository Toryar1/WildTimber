# ─────────────────────────────────────────────────────────────────────────────
# config.yml — Configuración Principal de WildTimber
# ─────────────────────────────────────────────────────────────────────────────
#
# RESUMEN DE MÓDULOS DE DETECCIÓN:
# WildTimber utiliza 3 módulos de detección complementarios para gestionar árboles:
#
# 1. MÓDULO PRINCIPAL (BFS 26 vías + Cuellos de botella):
#    Analiza tronco y copa en 26 vías (diagonales incluidas, ideal para árboles
#    personalizados con ramas diagonales). Si detecta múltiples troncos, intenta
#    separar árboles fusionados cortando uniones delgadas (cuellos de botella)
#    según los criterios de tamaño y costo configurados en trees.*.
#
# 2. MÓDULO 6 VÍAS (BFS 6-way):
#    Si la detección principal (26 vías) abarca un clúster demasiado grande,
#    el plugin reinicia inmediatamente con conectividad estricta de 6 vías.
#    Esto separa árboles que solo se tocan por las esquinas.
#
# 3. MÓDULO DE RESPALDO (Respaldo Cilíndrico):
#    Si la separación de cuellos de botella falla, el plugin corta una porción
#    cilíndrica alrededor del tronco golpeado basada en la densidad local.
# ─────────────────────────────────────────────────────────────────────────────

plugin:
  enabled: true          # true = plugin activo | false = desactivado globalmente
  # Código de idioma del plugin (en, fr, de, es, pt_BR, nl, pl, ru, zh_CN, it)
  language: "en"
  # Establecer en true para ver registros de depuración en la consola
  debug: false           # Ejemplo: debug: true -> muestra escaneos en consola
  # Establecer en true para activar registros detallados de caída de hojas
  verbose-debug: false

worlds:
  # Lista de mundos donde WildTimber está desactivado.
  # Si está vacía, el plugin está activo en todos los mundos por defecto.
  disabled:
    - "ignored_world_example"

health:
  # Coeficiente multiplicador global de HP para árboles.
  # HP Total = suma de pesos de troncos * base-coefficient
  # Ejemplo: 1.0 = normal | 2.0 = árbol el doble de resistente
  base-coefficient: 1.0

  # Tiempo de inactividad (en segundos) antes de comenzar la regeneración.
  # Ejemplo: 180 = 3 minutos de inactividad -> regeneración comienza
  inactivity-delay-seconds: 180

  regen:
    # true = HP se regenera si el árbol no ha sido golpeado en inactivity-delay-seconds
    enabled: true        # Ejemplo: false -> el árbol conserva su daño indefinidamente

    # Porcentaje de HP máx recuperado por tick de regeneración.
    # Ejemplo: 10.0 = 10% por paso -> recuperación completa en 10 pasos
    percent-per-step: 10.0

    # Intervalo entre ticks de regeneración, en segundos.
    # Ejemplo: 60 = 1 paso de regeneración cada 60 segundos
    step-seconds: 60

  # Activar visualización del progreso de daño en el tronco (grietas)
  visual-tree-health-enabled: true

trigger:
  # Modo de activación. Actualmente solo se admite RIGHT_CLICK_AXE.
  mode: "RIGHT_CLICK_AXE"

  # true = enviar aviso al jugador que rompe un tronco sin enganchar el árbol
  send-hint-message: true   # Ejemplo: false -> sin mensajes de ayuda

  # Tiempo (en segundos) entre dos avisos para el mismo jugador.
  # Ejemplo: 60 = un aviso por minuto por jugador
  hint-cooldown-seconds: 60

  # Tiempo mínimo entre dos clics contabilizados (en milisegundos)
  # Ejemplo: 350 -> un clic cada 350ms máximo
  click-cooldown-ms: 350

durability:
  # Daño base infligido al árbol por clic según la herramienta usada.
  # Clave especial AIR (o HAND) = mano vacía.
  # Ejemplo: DIAMOND_AXE: 5.0 -> hacha de diamante inflige 5 HP por clic
  multipliers:
    WOODEN_AXE: 1.0       # Hacha de madera
    STONE_AXE: 1.5        # Hacha de piedra
    IRON_AXE: 2.0         # Hacha de hierro
    GOLDEN_AXE: 2.5       # Hacha de oro
    DIAMOND_AXE: 3.5      # Hacha de diamante
    NETHERITE_AXE: 5.0    # Hacha de netherita
    AIR: 0.5              # Mano vacía (HAND -> usa AIR internamente)

  # Daño adicional añadido por nivel de encantamiento.
  enchantments:
    # Daño bonus por nivel de Eficiencia.
    # Ejemplo: 0.5 -> Eficiencia III añade 3 * 0.5 = 1.5 HP extra
    efficiency: 0.5

    # Daño bonus por nivel de Afilado.
    # Ejemplo: 0.3 -> Afilado V añade 5 * 0.3 = 1.5 HP extra
    sharpness: 0.3

  # Multiplicador de eficiencia interno.
  efficiency-level-multiplier: 0.2

  extra-loss:
    # true = la herramienta pierde durabilidad extra al talar
    enabled: true          # Ejemplo: false -> sin desgaste extra

    # Puntos de durabilidad extra perdidos por golpe.
    # Ejemplo: 1 = 1 punto extra de durabilidad perdido por clic
    points-per-interval: 1

    # Porcentaje de probabilidad (0-100) de perder durabilidad extra.
    # Ejemplo: 50 = 50% de probabilidad de desgaste extra
    chance-percent: 100

limits:
  # Preajuste de detección de árboles:
  # - CUSTOM  : Utiliza todas las reglas definidos abajo. (Recomendado)
  # - VANILLA : Ignora límites inferiores y usa reglas estándar de Minecraft
  preset: "CUSTOM"

  # Determina si los bloques en lista negra (construcciones) evitan la tala.
  # true (por defecto): protege construcciones de jugadores.
  # false: ignora la lista negra de construcciones al talar.
  blacklist-enabled: true

  # true = el árbol debe estar en contacto con el suelo para ser talado.
  # false = se aceptan árboles flotantes o no enraizados.
  tree-contact-required: true

  # Número máximo de troncos en un árbol antes de considerarlo demasiado grande.
  # Ejemplo: 1024 -> rechaza procesar árboles con más de 1024 troncos
  max-logs: 1024

  # Número total máximo de bloques (troncos + hojas) en un árbol.
  # Ejemplo: 4096 -> límite global de 4096 bloques por árbol
  max-blocks: 4096

  # Radio horizontal máximo (XZ, en bloques) del escaneo desde el tronco.
  # Ejemplo: 16 -> busca troncos hasta 16 bloques de distancia horizontal
  max-radius-xz: 16

  # Altura vertical máxima (Y, en bloques) del escaneo desde el bloque golpeado.
  # Generalmente debe ser mayor que max-radius-xz.
  # Ejemplo: 64 -> busca troncos hasta 64 bloques de altura
  max-height-y: 64

  # Número máximo de bloques no-árbol conectados tolerados.
  max-connected-non-tree-blocks: 50

  # Distancia máxima de propagación BFS para detección y caída de hojas.
  # - leaf-decay-range-xz: radio horizontal máximo (XZ) de escaneo de hojas.
  # - leaf-decay-range-y : radio vertical máximo (Y) de escaneo de hojas.
  # Ejemplo: xz: 6, y: 8 -> busca hojas hasta 6 bloques horiz. y 8 vert.
  leaf-decay-range-xz: 6
  leaf-decay-range-y: 8

  # Permitir detección diagonal (26 direcciones en vez de 6)
  # - allow-diagonal-logs: conecta troncos en diagonal
  # - allow-diagonal-leaves: conecta hojas en diagonal
  allow-diagonal-logs: true
  allow-diagonal-leaves: true

  # Factores de incremento dinámico del radio para árboles grandes:
  # Cada X troncos cortados, añade +Y al radio XZ y +Z al radio Y.
  # Establecer en 0 para desactivar.
  leaf-decay-scaling-logs: 100
  leaf-decay-scaling-xz-bonus: 1
  leaf-decay-scaling-y-bonus: 2

  # Bloques considerados accesorios/flotantes a limpiar tras la tala.
  # Ejemplo: SNOW, HONEYCOMB_BLOCK, HONEY_BLOCK...
  cleanup-floating-blocks:
    - "SNOW"
    - "HONEYCOMB_BLOCK"
    - "HONEY_BLOCK"
    - "DARK_OAK_FENCE"
    - "DARK_OAK_FENCE_GATE"

  # Multiplicador de rendimiento de troncos al talar.
  # Troncos soltados = ceil(troncos_totales * log-yield-multiplier)
  # Ejemplo: 0.75 -> un árbol de 100 troncos da 75 troncos
  log-yield-multiplier: 0.75

  # Número de iteraciones de búsqueda de ramas en la copa.
  # Busca iterativamente troncos adyacentes a hojas.
  # Aumentar si quedan troncos en árboles grandes personalizados.
  # Ejemplo: 5 -> 5 pasadas de detección (predeterminado recomendado)
  #          10 -> más preciso para árboles muy complejos
  max-branch-discovery-iterations: 5

  # Tamaño máximo de un cúmulo huérfano aislado a absorber.
  # Un cúmulo huérfano no toca ni el suelo ni el árbol principal.
  # Si es lo suficientemente pequeño, se considera parte del árbol.
  # Ejemplo: 10 -> absorbe fragmentos <= 10 bloques
  max-orphan-cluster-size: 10

  # Regla para troncos aislados en la copa.
  # true = considera estos troncos como parte del árbol principal.
  isolated-logs-rule: true

  # Opciones para limpiar hojas solitarias tras la tala.
  orphan-leaves-cleanup:
    # true = limpia automáticamente hojas sin tronco cercano
    enabled: true
    # Radio de escaneo alrededor del árbol talado
    radius: 5

  # Opciones para reemplazar raíces subterráneas (tierra en vez de aire)
  root-replacement:
    # true = activa reemplazo de raíces subterráneas por bloques sólidos
    enabled: true
    # Material de reemplazo (nombre Bukkit Material)
    # Ejemplo: DIRT, COARSE_DIRT, NETHERRACK...
    material: "DIRT"

  # Radio alrededor del árbol para buscar troncos huérfanos.
  isolated-logs-radius: 6

  # Número máximo de troncos conectados para grupos huérfanos.
  isolated-log-max: 4

  # true = permite iniciar el escaneo en un tronco no enraizado.
  # El plugin bajará verticalmente para encontrar el tronco real.
  allow-non-rooted-start: false

  # Profundidad máxima hacia abajo para encontrar un tronco enraizado.
  max-root-search-depth: 16

  # Presupuesto máximo para el BFS restringido de 6 vías
  # Permite cortar árboles gigantes sin escanear todo su volumen
  6way-max-logs: 2048

  # Activar fase de limpieza de copa tras la tala
  canopy-cleanup-enabled: true

  # Margen de bloques alrededor del árbol para escanear hojas huérfanas
  canopy-cleanup-padding: 12

  # Cantidad de hojas procesadas por tick (predeterminado: 64)
  leaves-persistence-batch-size: 64

# ─────────────────────────────────────────────────────────────────────────────
# Anti-cheat
# ─────────────────────────────────────────────────────────────────────────────
anti-cheat:
  # true = activar detección anti-cheat
  enabled: true
  # Tiempo mínimo entre dos clics (en ms)
  min-click-interval-ms: 100
  # Cambio de ángulo de visión mínimo requerido (en grados)
  min-look-change-degrees: 0.1
  # Número máximo de clics consecutivos con intervalo demasiado regular
  max-regular-clicks: 8

# ─────────────────────────────────────────────────────────────────────────────
# Particionado de múltiples fuentes (separación de árboles adyacentes)
# ─────────────────────────────────────────────────────────────────────────────
trees:
  # Número mínimo de troncos conectados al suelo para validar un tronco.
  # Ejemplo: 4 -> un tronco debe tener al menos 4 bloques
  min-logs-rooted: 4

  # Número mínimo de troncos aislados para tronco virtual.
  # Allows treating small floating groups as mini-trees.
  # Ejemplo: 3 -> grupo de 3+ troncos flotantes se trata como árbol
  min-logs-isolated: 3

  # Grosor máximo (en troncos) de un cuello de botella entre árboles.
  # Si una unión tiene más troncos, los árboles no se separan.
  # Ejemplo: 4 -> conexión de <= 4 troncos es un cuello separable
  max-bridge-section-size: 4

  # Costo máximo de un cuello de botella admisible.
  # Cuanto más alta y ancha es una unión, mayor es su costo.
  max-bridge-cost: 20.0

  # Coeficiente de ponderación de altura para cortes.
  # Ejemplo: 0.1 -> ligera ventaja a cortes altos
  height-weight-alpha: 0.1

  # Radio máximo alrededor del tronco para buscar uniones.
  bridge-search-radius: 16

# ─────────────────────────────────────────────────────────────────────────────
# Rendimiento (corte progresivo para árboles muy grandes)
# ─────────────────────────────────────────────────────────────────────────────
performance:
  # true = activar corte progresivo para árboles grandes
  staged-cut-enabled: true

  # A partir de este total de bloques, se tala en múltiples pasadas.
  # Ejemplo: 256 -> árboles de más de 256 bloques se cortan progresivamente
  staged-cut-min-blocks: 256

  # Altura (en bloques) de una capa destruida por paso.
  # Ejemplo: 1 -> 1 nivel Y cortado por pasada
  staged-cut-slice-height: 1

  # Tiempo entre capas (en ticks del servidor, 20 ticks = 1 segundo).
  # Ejemplo: 5 -> 1 capa cada 5 ticks (4 por segundo)
  staged-cut-interval-ticks: 5

# ─────────────────────────────────────────────────────────────────────────────
# Relleno subterráneo de raíces
# ─────────────────────────────────────────────────────────────────────────────
roots:
  # true = reemplaza troncos subterráneos por bloques sólidos en vez de aire.
  backfill-enabled: true

  # Bloque por defecto si no se encuentra un vecino sólido.
  backfill-block: "DIRT"

  # Modo de relleno: HOLE_DETECTOR (recomendado), LEGACY o NONE
  fill-mode: "HOLE_DETECTOR"

  # Profundidad máxima de escaneo y relleno
  fill-depth: 16

  # Bloques adicionales horizontales alrededor del tronco
  fill-radius-extra: 0

  # Factor de ensanchamiento natural en el centro (Pata de Elefante)
  elephant-factor: 1.5

  # Pendiente máxima permitida entre columnas adyacentes
  # Valor más bajo = superficie más plana
  max-slope: 2

  # Número de vecinos usados para interpolación IDW (recomendado: 8)
  idw-neighbors: 8

  # [LEGACY] Profundidad máxima de relleno.
  max-backfill-depth: 6

  # [LEGACY] Margen de bloques XZ más allá del tronco
  root-fill-padding: 2

  # [LEGACY] Margen de profundidad bajo el tronco más bajo
  root-fill-depth-padding: 2

# ─────────────────────────────────────────────────────────────────────────────
# Algoritmo de respaldo cilíndrico (Módulo de respaldo)
# ─────────────────────────────────────────────────────────────────────────────
fallback:
  # true = activar escaneo cilíndrico de respaldo si falla el método principal
  enabled: true

  # Número máximo de bloques para aplicar el respaldo.
  # Más allá de esto, se rechaza la tala masiva.
  max-blocks: 2048

  # Radio horizontal para buscar columnas del tronco principal.
  # Ejemplo: 1 -> columnas inmediatamente adyacentes al tronco
  trunk-core-radius: 1

  # Número mínimo de troncos verticales consecutivos.
  trunk-min-height: 3

  # Radio horizontal máximo en modo respaldo.
  # Ejemplo: 8 -> cilindro de radio 8 alrededor del tronco
  max-radius: 8

  # Densidad mínima (0.0 a 1.0) para incluir un anillo.
  # Si la densidad cae por debajo de este umbral, la expansión se detiene.
  # Ejemplo: 0.10 -> mínimo 10% de bloques de árbol
  min-density: 0.10

  # Ancho de los anillos de distancia (en bloques).
  ring-step: 1

# ─────────────────────────────────────────────────────────────────────────────
# Gotas de hojas eliminadas
# ─────────────────────────────────────────────────────────────────────────────
leaf-drops:
  enabled: true          # activar/desactivar caídas de hojas
  sapling-chance: 0.05   # 5% por hoja (NO MODIFICAR)
  stick-chance: 0.02     # 2% por hoja (NO MODIFICAR)
  apple-chance: 0.005    # 0.5% (solo roble + roble oscuro) (NO MODIFICAR)
