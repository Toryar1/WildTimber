# ─────────────────────────────────────────────────────────────────────────────
# config.yml — Configurazione Principale di WildTimber
# ─────────────────────────────────────────────────────────────────────────────
#
# PANORAMICA DEI MODULI DI RILEVAMENTO:
# WildTimber usa 3 moduli complementari per gestire gli alberi:
#
# 1. MODULO PRINCIPALE (BFS 26-vie + Colli di bottiglia):
#    Analizza tronco e chioma in 26 vie (diagonali incluse, ideale per alberi
#    personalizzati con rami diagonali). Se rileva più tronchi, tenta di separare
#    alberi fusi tagliando giunzioni sottili (colli di bottiglia) secondo
#    i criteri di dimensione e costo configurati sotto trees.*.
#
# 2. MODULO 6-VIE (BFS 6-way):
#    Se la rilevazione principale (26-vie) abbraccia un cluster troppo grande, il plugin
#    riavvia immediatamente in connettività stretta a 6 vie. Questo separa
#    automaticamente alberi che si toccano solo negli angoli.
#
# 3. MODULO FALLBACK (Cilindrico di Riserva):
#    Se la separazione per colli di bottiglia fallisce, il plugin taglia una porzione
#    cilindrica intorno al tronco colpito basandosi sulla densità locale.
# ─────────────────────────────────────────────────────────────────────────────

plugin:
  enabled: true          # true = plugin attivo | false = disabilitato globalmente
  # Codice lingua del plugin (en, fr, de, es, pt_BR, nl, pl, ru, zh_CN, it)
  language: "en"
  # Impostare a true per vedere i log di debug nella console
  debug: false           # Esempio: debug: true → mostra le scansioni nella console
  # Impostare a true per log dettagliati dei drop di foglie (molto spam!)
  verbose-debug: false

worlds:
  # Elenco dei mondi in cui WildTimber è disabilitato.
  # Se vuoto, il plugin è attivo in tutti i mondi di default.
  disabled:
    - "ignored_world_example"

health:
  # Global HP coefficient multiplier for trees.
  # Total HP = sum of log weights × base-coefficient
  # Example: 1.0 = normal | 2.0 = tree twice as resistant
  base-coefficient: 1.0

  # Inactivity delay (in seconds) before regeneration begins.
  # Example: 180 = 3 minutes of inactivity → regeneration starts
  inactivity-delay-seconds: 180

  regen:
    # true = HP regenerates if the tree hasn't been hit for inactivity-delay-seconds
    enabled: true        # Example: false → tree keeps its damage indefinitely

    # Percentage of max HP recovered per regeneration tick.
    # Example: 10.0 = 10% per step → full recovery in 10 steps
    percent-per-step: 10.0

    # Interval between each regeneration tick, in seconds.
    # Example: 60 = 1 regeneration step every 60 seconds
    step-seconds: 60

  # Enable visual display of damage progression on the targeted log (crack stages)
  visual-tree-health-enabled: true

trigger:
  # Trigger mode. Currently only RIGHT_CLICK_AXE is supported.
  mode: "RIGHT_CLICK_AXE"

  # true = send a hint message to the player who breaks a log without engaging the tree
  send-hint-message: true   # Example: false → no help message

  # Delay (in seconds) between two hint messages for the same player.
  # Example: 60 = one hint per minute per player
  hint-cooldown-seconds: 60

  # Minimum delay between two counted clicks (in milliseconds)
  # Example: 350 → one click every 350ms maximum
  click-cooldown-ms: 350

durability:
  # Base damage dealt to the tree per click based on the tool used.
  # Special key AIR (or HAND) = empty hand.
  # Example: DIAMOND_AXE: 5.0 → diamond axe deals 5 HP per click
  multipliers:
    WOODEN_AXE: 1.0       # Wooden axe
    STONE_AXE: 1.5        # Stone axe
    IRON_AXE: 2.0         # Iron axe
    GOLDEN_AXE: 2.5       # Golden axe
    DIAMOND_AXE: 3.5      # Diamond axe
    NETHERITE_AXE: 5.0    # Netherite axe
    AIR: 0.5              # Empty hand (HAND → uses AIR internally)

  # Additional damage added per enchantment level.
  enchantments:
    # Bonus damage per Efficiency level.
    # Example: 0.5 → Efficiency III adds 3 × 0.5 = 1.5 extra HP
    efficiency: 0.5

    # Bonus damage per Sharpness level.
    # Example: 0.3 → Sharpness V adds 5 × 0.3 = 1.5 extra HP
    sharpness: 0.3

  # Internal efficiency multiplier (reserved for future use).
  efficiency-level-multiplier: 0.2

  extra-loss:
    # true = the tool loses extra durability during felling
    enabled: true          # Example: false → no extra wear

    # Extra durability points lost per hit.
    # Example: 1 = 1 extra durability point per click
    points-per-interval: 1

    # Chance percentage (0-100) to lose extra durability per hit.
    # Example: 50 = 50% chance to lose durability points
    chance-percent: 100

limits:
  # Tree detection preset:
  # - CUSTOM  : Uses all rules, limits and criteria defined below. (Recommended)
  # - VANILLA : Ignores limits below and uses standard Minecraft vanilla tree presets
  preset: "CUSTOM"

  # Whether blacklist blocks (construction materials) prevent tree felling.
  # true (default): protects player constructions.
  # false: ignores the construction blacklist during felling.
  blacklist-enabled: true

  # true = the tree must be in contact with the ground (rooted) to be felled.
  # false = floating or non-rooted trees are accepted.
  tree-contact-required: true

  # Maximum number of logs in a tree before it is considered too large.
  # Example: 1024 → refuses to process a tree with more than 1024 logs
  max-logs: 1024

  # Maximum total block count (logs + leaves) in a tree.
  # Example: 4096 → global limit of 4096 blocks per tree
  max-blocks: 4096

  # Maximum horizontal radius (XZ, in blocks) of the detection scan from the trunk.
  # Example: 16 → searches for logs up to 16 blocks of horizontal distance
  max-radius-xz: 16

  # Maximum vertical height (Y, in blocks) of the detection scan from the clicked block.
  # Should generally be larger than max-radius-xz since trees are taller than wide.
  # Example: 64 → searches for logs up to 64 blocks in height
  max-height-y: 64

  # Maximum number of connected non-tree blocks tolerated (not currently used).
  max-connected-non-tree-blocks: 50

  # Maximum BFS propagation distance for leaf detection and decay.
  # - leaf-decay-range-xz: maximum horizontal distance (XZ) of leaf scan from trunk.
  # - leaf-decay-range-y : maximum vertical distance (Y) of leaf scan from trunk.
  # Example: xz: 6, y: 8 → searches leaves up to 6 blocks horizontally and 8 vertically.
  leaf-decay-range-xz: 6
  leaf-decay-range-y: 8

  # Allow diagonal detection (26 directions instead of 6 orthogonal faces)
  # - allow-diagonal-logs: connects logs diagonally (thin branches)
  # - allow-diagonal-leaves: connects leaves diagonally (spaced canopies)
  allow-diagonal-logs: true
  allow-diagonal-leaves: true

  # Dynamic radius increase factors for large trees:
  # Every X logs cut (leaf-decay-scaling-logs), add +Y to XZ radius and +Z to Y radius.
  # Set leaf-decay-scaling-logs to 0 or negative to disable this dynamic increase.
  leaf-decay-scaling-logs: 100
  leaf-decay-scaling-xz-bonus: 1
  leaf-decay-scaling-y-bonus: 2

  # Blocks considered as accessories/floating to clean up after felling if they lose support.
  # Example: SNOW, HONEYCOMB_BLOCK, HONEY_BLOCK, DARK_OAK_FENCE, DARK_OAK_FENCE_GATE
  cleanup-floating-blocks:
    - "SNOW"
    - "HONEYCOMB_BLOCK"
    - "HONEY_BLOCK"
    - "DARK_OAK_FENCE"
    - "DARK_OAK_FENCE_GATE"

  # Log yield multiplier during felling.
  # Dropped logs = ceil(log_count × log-yield-multiplier)
  # Example: 0.75 → a 100-log tree yields 75 logs | 1.0 = full yield
  log-yield-multiplier: 0.75

  # Number of branch search iterations in the canopy.
  # The plugin iteratively searches logs adjacent to detected leaves not rooted to ground.
  # Increase if logs remain after felling on very branchy custom trees.
  # Example: 5 → 5 branch detection passes (recommended default)
  #          10 → more precise for very complex trees, slightly slower
  max-branch-discovery-iterations: 5

  # Maximum size (in blocks) of a completely isolated orphan cluster to absorb.
  # An orphan cluster is a group of logs/leaves touching neither ground nor tree.
  # If small enough, it's considered part of the tree (isolated twig).
  # Example: 10 → absorbs fragments ≤ 10 blocks | 0 = disable
  max-orphan-cluster-size: 10

  # Rule for isolated logs in the canopy (no direct trunk connection but surrounded by leaves).
  # true = considers these logs as part of the main tree if they touch connected leaves.
  isolated-logs-rule: true

  # Options for cleaning up solitary/orphan leaves around the tree after felling.
  orphan-leaves-cleanup:
    # true = automatically cleans leaves with no nearby log (avoids floating leaves)
    enabled: true
    # Scan radius around the felled tree to search for solitary leaves
    radius: 5

  # Options for replacing underground roots (replaces underground logs with dirt instead of air)
  root-replacement:
    # true = enables replacement of underground roots with a solid block
    enabled: true
    # Replacement material (Bukkit Material name)
    # Example: DIRT, COARSE_DIRT, NETHERRACK...
    material: "DIRT"

  # Radius (in blocks) around the tree volume to search for orphan logs after felling.
  isolated-logs-radius: 6

  # Maximum number of connected logs in a group to be considered orphan.
  isolated-log-max: 4

  # true = allow the player to start the scan on a non-rooted log (e.g. high branch).
  # The plugin will descend vertically to find the real trunk.
  allow-non-rooted-start: false

  # Maximum search depth downward to find a rooted trunk when starting on a non-rooted log.
  max-root-search-depth: 16

  # Max budget for the restricted 6-way BFS (independent of max-logs)
  # Allows cutting giant trees without scanning their entire global volume
  6way-max-logs: 2048

  # Enable canopy cleanup phase after felling (recommended for large IRIS trees)
  canopy-cleanup-enabled: true

  # Padding (blocks) around the tree bounding box to scan for orphan leaves after felling
  canopy-cleanup-padding: 12

  # Number of leaves processed per tick for persistence updates (default: 64)
  leaves-persistence-batch-size: 64

# ─────────────────────────────────────────────────────────────────────────────
# Anti-cheat
# ─────────────────────────────────────────────────────────────────────────────
anti-cheat:
  # true = enable anti-cheat detection
  enabled: true
  # Minimum cooldown between two clicks (in milliseconds) to break/interact with a tree
  min-click-interval-ms: 100
  # Minimum view change required (cumulative yaw or pitch in degrees) between clicks
  min-look-change-degrees: 0.1
  # Maximum number of consecutive clicks with a too-regular interval (near-zero variance)
  max-regular-clicks: 8

# ─────────────────────────────────────────────────────────────────────────────
# Partizionamento multi-sorgente (separazione di alberi adiacenti)
# ─────────────────────────────────────────────────────────────────────────────
trees:
  # Minimum number of logs connected to the ground to consider a trunk valid.
  # Example: 4 → a trunk must have at least 4 logs before being recognized
  min-logs-rooted: 4

  # Minimum number of isolated logs (not on ground) to create a virtual trunk.
  # Allows treating small floating groups as mini-trees.
  # Example: 3 → a cluster of 3+ floating logs is treated as a tree
  min-logs-isolated: 3

  # Maximum thickness (in logs) of a bottleneck between two sub-trees.
  # If a junction has more logs than this value, trees are not separated.
  # Example: 4 → a connection of ≤ 4 logs is considered a separable bottleneck
  max-bridge-section-size: 4

  # Maximum cost (weighted by height) of an admissible bottleneck.
  # The higher and wider a junction, the higher its cost.
  max-bridge-cost: 20.0

  # Height weighting coefficient for cuts.
  # Example: 0.1 → slight advantage to high cuts
  height-weight-alpha: 0.1

  # Maximum radius around the targeted trunk to search for junctions between trees.
  bridge-search-radius: 16

# ─────────────────────────────────────────────────────────────────────────────
# Prestazioni (taglio progressivo per alberi molto grandi)
# ─────────────────────────────────────────────────────────────────────────────
performance:
  # true = abilitare il taglio a stadi per alberi grandi
  staged-cut-enabled: true

  # Oltre questo numero totale di blocchi, tagliare in più passate.
  # Esempio: 256 → alberi più grandi di 256 blocchi verranno tagliati progressivamente
  staged-cut-min-blocks: 256

  # Altezza (in blocchi) di una fetta distrutta per step.
  # Esempio: 1 → 1 livello Y tagliato per passata
  staged-cut-slice-height: 1

  # Ritardo tra ogni fetta (in tick del server, 20 tick = 1 secondo).
  # Esempio: 5 → 1 fetta ogni 5 tick
  staged-cut-interval-ticks: 5

# ─────────────────────────────────────────────────────────────────────────────
# Riempimento delle radici sotterranee
# ─────────────────────────────────────────────────────────────────────────────
roots:
  # true = replaces underground logs with a solid block instead of air.
  backfill-enabled: true

  # Default block if no solid neighbor is found.
  backfill-block: "DIRT"

  # Backfill mode: HOLE_DETECTOR (recommended), LEGACY (original), or NONE
  fill-mode: "HOLE_DETECTOR"

  # Maximum scan and backfill depth
  fill-depth: 16

  # Number of additional blocks to include horizontally around the XZ bounding box
  fill-radius-extra: 0

  # Natural ground flare factor at the center (Elephant Foot)
  elephant-factor: 1.5

  # Maximum allowed slope between adjacent columns during smoothing (in blocks)
  # Lower value = flatter surface
  max-slope: 2

  # Number of neighbors used for IDW interpolation (recommended: 8)
  idw-neighbors: 8

  # [LEGACY] Maximum backfill depth (in blocks below the surface).
  max-backfill-depth: 6

  # [LEGACY] Number of XZ blocks beyond the trunk to include in the backfill flood fill
  root-fill-padding: 2

  # [LEGACY] Additional depth margin below the lowest cut log in the column
  root-fill-depth-padding: 2

# ─────────────────────────────────────────────────────────────────────────────
# Algoritmo di fallback cilindrico
# ─────────────────────────────────────────────────────────────────────────────
fallback:
  # true = enable the cylindrical fallback algorithm when the main method fails
  enabled: true

  # Maximum number of blocks for which the fallback can apply.
  # Beyond this, massive felling is refused.
  max-blocks: 2048

  # Horizontal radius to search for columns of the main trunk.
  # Example: 1 → columns immediately adjacent to the struck trunk
  trunk-core-radius: 1

  # Minimum number of consecutive vertical logs to consider a column as a trunk.
  trunk-min-height: 3

  # Maximum horizontal radius for the tree in fallback mode.
  # Example: 8 → cylinder of radius 8 around the trunk
  max-radius: 8

  # Minimum density (0.0 to 1.0) to include a ring in the tree.
  # If a ring's density falls below this threshold, expansion stops.
  # Example: 0.10 → minimum 10% of tree blocks
  min-density: 0.10

  # Width of distance rings (in blocks).
  ring-step: 1

# ─────────────────────────────────────────────────────────────────────────────
# Drop dalle foglie rimosse
# ─────────────────────────────────────────────────────────────────────────────
leaf-drops:
  enabled: true          # abilitare/disabilitare i drop di foglie
  sapling-chance: 0.05   # 5% per foglia (NON MODIFICARE)
  stick-chance: 0.02     # 2% per foglia (NON MODIFICARE)
  apple-chance: 0.005    # 0.5% (solo quercia + foresta oscura) (NON MODIFICARE)
