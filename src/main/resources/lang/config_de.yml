# ─────────────────────────────────────────────────────────────────────────────
# config.yml — WildTimber Hauptkonfiguration
# ─────────────────────────────────────────────────────────────────────────────
#
# ÜBERSICHT DER ERKENNUNGSMODULE:
# WildTimber verwendet 3 komplementäre Erkennungsmodule zur Baumverwaltung:
#
# 1. HAUPTMODUL (BFS 26-Wege + Engpässe):
#    Analysiert Stamm und Krone in 26-Wegen (Diagonalen eingeschlossen, ideal für
#    benutzerdefinierte Bäume mit diagonalen Ästen). Bei mehreren Stämmen versucht
#    es, zusammengewachsene Bäume durch Schneiden dünner Verbindungen (Engpässe)
#    gemäß den Größen- und Kostenkriterien unter trees.* zu trennen.
#
# 2. 6-WEGE-MODUL (BFS 6-Wege):
#    Falls die Haupterkennung (26-Wege) einen zu großen Cluster erfasst, startet
#    das Plugin sofort einen strikten 6-Wege-Scan neu. Dies trennt automatisch
#    Bäume, die sich nur an Ecken berühren.
#
# 3. FALLBACK-MODUL (Zylindrischer Rückfall):
#    Falls die Engpasstrennung fehlschlägt, schneidet das Plugin einen zylindrischen
#    Bereich um den getroffenen Stamm basierend auf lokaler Dichte.
# ─────────────────────────────────────────────────────────────────────────────

plugin:
  enabled: true          # true = Plugin aktiv | false = global deaktiviert
  # Plugin-Sprachcode (en, fr, de, es, pt_BR, nl, pl, ru, zh_CN, it)
  language: "en"
  # Auf true setzen, um Debug-Logs in der Konsole zu sehen
  debug: false           # Beispiel: debug: true → zeigt Scans in der Konsole
  # Auf true setzen für detaillierte Blatt-Drop-Logs (sehr spam-intensiv!)
  verbose-debug: false

worlds:
  # Liste der Welten, in denen WildTimber deaktiviert ist.
  # Wenn leer, ist das Plugin standardmäßig in allen Welten aktiv.
  disabled:
    - "ignored_world_example"

health:
  # Globaler HP-Multiplikator für Bäume.
  # Gesamt-HP = Summe der Stammgewichte × base-coefficient
  # Beispiel: 1.0 = normal | 2.0 = Baum doppelt so widerstandsfähig
  base-coefficient: 1.0

  # Inaktivitätsverzögerung (in Sekunden) bevor die Regeneration beginnt.
  # Beispiel: 180 = 3 Minuten Inaktivität → Regeneration startet
  inactivity-delay-seconds: 180

  regen:
    # true = HP regeneriert, wenn der Baum seit inactivity-delay-seconds nicht getroffen wurde
    enabled: true        # Beispiel: false → Baum behält seinen Schaden dauerhaft

    # Prozentsatz der maximalen HP, der pro Regenerationstick wiederhergestellt wird.
    # Beispiel: 10.0 = 10% pro Schritt → vollständige Erholung in 10 Schritten
    percent-per-step: 10.0

    # Intervall zwischen Regenerationsticks, in Sekunden.
    # Beispiel: 60 = 1 Regenerationsschritt alle 60 Sekunden
    step-seconds: 60

  # Visuelle Anzeige des Schadensfortschritts am Zielstamm aktivieren (Rissstufen)
  visual-tree-health-enabled: true

trigger:
  # Auslösemodus. Derzeit wird nur RIGHT_CLICK_AXE unterstützt.
  mode: "RIGHT_CLICK_AXE"

  # true = Hinweisnachricht an Spieler senden, die einen Stamm brechen ohne den Baum zu engagieren
  send-hint-message: true   # Beispiel: false → keine Hilfsmeldung

  # Verzögerung (in Sekunden) zwischen zwei Hinweisnachrichten für denselben Spieler.
  # Beispiel: 60 = ein Hinweis pro Minute pro Spieler
  hint-cooldown-seconds: 60

  # Mindestverzögerung zwischen zwei gezählten Klicks (in Millisekunden)
  # Beispiel: 350 → ein Klick alle 350ms maximal
  click-cooldown-ms: 350

durability:
  # Basisschaden pro Klick basierend auf dem verwendeten Werkzeug.
  # Spezialtaste AIR (oder HAND) = leere Hand.
  # Beispiel: DIAMOND_AXE: 5.0 → Diamantaxt fügt 5 HP pro Klick zu
  multipliers:
    WOODEN_AXE: 1.0       # Holzaxt
    STONE_AXE: 1.5        # Steinaxt
    IRON_AXE: 2.0         # Eisenaxt
    GOLDEN_AXE: 2.5       # Goldaxt
    DIAMOND_AXE: 3.5      # Diamantaxt
    NETHERITE_AXE: 5.0    # Netheritatxt
    AIR: 0.5              # Leere Hand (HAND → verwendet intern AIR)

  # Zusätzlicher Schaden pro Verzauberungsstufe.
  enchantments:
    # Bonusschaden pro Effizienz-Stufe.
    # Beispiel: 0.5 → Effizienz III fügt 3 × 0.5 = 1.5 extra HP hinzu
    efficiency: 0.5

    # Bonusschaden pro Schärfe-Stufe.
    # Beispiel: 0.3 → Schärfe V fügt 5 × 0.3 = 1.5 extra HP hinzu
    sharpness: 0.3

  # Interner Effizienz-Multiplikator (für zukünftige Verwendung reserviert).
  efficiency-level-multiplier: 0.2

  extra-loss:
    # true = Werkzeug verliert beim Fällen zusätzliche Haltbarkeit
    enabled: true          # Beispiel: false → kein zusätzlicher Verschleiß

    # Extra Haltbarkeitspunkte verloren pro Treffer.
    # Beispiel: 1 = 1 extra Haltbarkeitspunkt pro Klick
    points-per-interval: 1

    # Chance-Prozentsatz (0-100) extra Haltbarkeit pro Treffer zu verlieren.
    # Beispiel: 50 = 50% Chance Haltbarkeitspunkte zu verlieren
    chance-percent: 100

limits:
  # Baumerkennungs-Preset:
  # - CUSTOM  : Verwendet alle unten definierten Regeln und Limits. (Empfohlen)
  # - VANILLA : Ignoriert die Limits unten und verwendet Standard-Minecraft-Baum-Presets
  preset: "CUSTOM"

  # Ob Blacklist-Blöcke (Baumaterialien) das Fällen verhindern.
  # true (Standard): schützt Spielerkonstruktionen.
  # false: ignoriert die Baukonstruktions-Blacklist beim Fällen.
  blacklist-enabled: true

  # true = der Baum muss Bodenkontakt haben (verwurzelt) um zu fallen.
  # false = schwebende oder nicht verwurzelte Bäume werden akzeptiert.
  tree-contact-required: true

  # Maximale Stammanzahl vor dem 'zu groß'-Status.
  # Beispiel: 1024 → lehnt Bäume mit mehr als 1024 Stämmen ab
  max-logs: 1024

  # Maximale Gesamtblockanzahl (Stämme + Blätter) in einem Baum.
  # Beispiel: 4096 → globales Limit von 4096 Blöcken pro Baum
  max-blocks: 4096

  # Maximaler horizontaler Radius (XZ, in Blöcken) des Erkennungsscans.
  # Beispiel: 16 → sucht Stämme bis zu 16 Blöcke horizontaler Entfernung
  max-radius-xz: 16

  # Maximale vertikale Höhe (Y, in Blöcken) des Erkennungsscans.
  # Sollte generell größer als max-radius-xz sein (Bäume sind höher als breit).
  # Beispiel: 64 → sucht Stämme bis zu 64 Blöcke Höhe
  max-height-y: 64

  # Maximale verbundene Nicht-Baum-Blöcke (derzeit nicht verwendet).
  max-connected-non-tree-blocks: 50

  # Maximale BFS-Ausbreitungsweite für Blatterkennung und -zerfall.
  # - leaf-decay-range-xz: maximale horizontale Blatt-Scan-Weite (XZ) vom Stamm.
  # - leaf-decay-range-y : maximale vertikale Blatt-Scan-Weite (Y) vom Stamm.
  # Beispiel: xz: 6, y: 8 → sucht Blätter bis 6 Blöcke horizontal und 8 vertikal.
  leaf-decay-range-xz: 6
  leaf-decay-range-y: 8

  # Diagonalerkennung erlauben (26 Richtungen statt 6 orthogonale Flächen)
  # - allow-diagonal-logs: verbindet Stämme diagonal (dünne Äste)
  # - allow-diagonal-leaves: verbindet Blätter diagonal (weitläufige Kronen)
  allow-diagonal-logs: true
  allow-diagonal-leaves: true

  # Dynamische Radiuserhöhungsfaktoren für große Bäume:
  # Alle X geschnittenen Stämme (leaf-decay-scaling-logs), +Y XZ-Radius und +Z Y-Radius.
  # leaf-decay-scaling-logs auf 0 oder negativ setzen um die dynamische Erhöhung zu deaktivieren.
  leaf-decay-scaling-logs: 100
  leaf-decay-scaling-xz-bonus: 1
  leaf-decay-scaling-y-bonus: 2

  # Blöcke als Zubehör/schwebend betrachtet, die nach dem Fällen gereinigt werden.
  # Beispiel: SNOW, HONEYCOMB_BLOCK, HONEY_BLOCK, DARK_OAK_FENCE, DARK_OAK_FENCE_GATE
  cleanup-floating-blocks:
    - "SNOW"
    - "HONEYCOMB_BLOCK"
    - "HONEY_BLOCK"
    - "DARK_OAK_FENCE"
    - "DARK_OAK_FENCE_GATE"

  # Stamm-Ertrags-Multiplikator beim Fällen.
  # Gefallene Stämme = ceil(Stammanzahl × log-yield-multiplier)
  # Beispiel: 0.75 → 100-Stamm-Baum ergibt 75 Stämme | 1.0 = voller Ertrag
  log-yield-multiplier: 0.75

  # Anzahl der Ast-Suchiterationen in der Krone.
  # Das Plugin sucht iterativ nach Stämmen neben erkannten Blättern die nicht am Boden verwurzelt sind.
  # Erhöhen wenn Stämme nach dem Fällen bei sehr verzweigten Custombäumen verbleiben.
  # Beispiel: 5 → 5 Astsuch-Durchgänge (empfohlener Standard)
  #          10 → präziser für sehr komplexe Bäume, etwas langsamer
  max-branch-discovery-iterations: 5

  # Maximale Größe (in Blöcken) eines vollständig isolierten Waisenclusters zum Absorbieren.
  # Ein Waisencluster ist eine Gruppe von Stämmen/Blättern die weder den Boden noch den Baum berührt.
  # Wenn klein genug, gilt es als Teil des Baums (isolierter Ast).
  # Beispiel: 10 → absorbiert Fragmente ≤ 10 Blöcke | 0 = deaktivieren
  max-orphan-cluster-size: 10

  # Regel für isolierte Stämme in der Krone (keine direkte Stammverbindung aber von Blättern umgeben).
  # true = betrachtet diese Stämme als Teil des Hauptbaums wenn sie verbundene Blätter berühren.
  isolated-logs-rule: true

  # Optionen zur Reinigung verwaister Blätter um den Baum nach dem Fällen.
  orphan-leaves-cleanup:
    # true = reinigt automatisch Blätter ohne nahes Stamm (vermeidet schwebende Blätter)
    enabled: true
    # Scan-Radius um den gefällten Baum für solitäre Blätter
    radius: 5

  # Optionen zum Ersetzen unterirdischer Wurzeln
  root-replacement:
    # true = aktiviert das Ersetzen unterirdischer Wurzeln durch festen Block
    enabled: true
    # Ersatzmaterial (Bukkit-Materialname)
    # Beispiel: DIRT, COARSE_DIRT, NETHERRACK...
    material: "DIRT"

  # Radius (in Blöcken) um das Baumvolumen für Waisenstammsuche nach dem Fällen.
  isolated-logs-radius: 6

  # Maximale verbundene Stämme in einer Gruppe um als Waise zu gelten.
  isolated-log-max: 4

  # true = Spieler darf den Scan auf einem nicht verwurzelten Stamm starten (z.B. hoher Ast).
  # Das Plugin steigt vertikal ab um den echten Stamm zu finden.
  allow-non-rooted-start: false

  # Maximale Suchtiefe nach unten für einen verwurzelten Stamm.
  max-root-search-depth: 16

  # Maximales Budget für den eingeschränkten 6-Wege-BFS (unabhängig von max-logs)
  # Ermöglicht das Fällen riesiger Bäume ohne ihr gesamtes Volumen zu scannen
  6way-max-logs: 2048

  # Kronensäuberungsphase nach dem Fällen aktivieren (empfohlen für große IRIS-Bäume)
  canopy-cleanup-enabled: true

  # Padding (Blöcke) um die Baum-Begrenzungsbox für Waisenblatt-Scan
  canopy-cleanup-padding: 12

  # Anzahl der pro Tick verarbeiteten Blätter für Persistenzaktualisierungen (Standard: 64)
  leaves-persistence-batch-size: 64

# ─────────────────────────────────────────────────────────────────────────────
# Anti-Cheat
# ─────────────────────────────────────────────────────────────────────────────
anti-cheat:
  # true = Anti-Cheat-Erkennung aktivieren
  enabled: true
  # Minimale Abklingzeit zwischen zwei Klicks (in Millisekunden)
  min-click-interval-ms: 100
  # Minimale Ansichtsänderung (Yaw oder Pitch in Grad) zwischen Klicks
  min-look-change-degrees: 0.1
  # Maximale aufeinanderfolgende Klicks mit zu regelmäßigem Intervall
  max-regular-clicks: 8

# ─────────────────────────────────────────────────────────────────────────────
# Mehrquellen-Partitionierung (Trennung angrenzender Bäume)
# ─────────────────────────────────────────────────────────────────────────────
trees:
  # Mindestanzahl bodenverbundener Stämme, um einen gültigen Baumstamm zu betrachten.
  # Beispiel: 4 → ein Stamm muss mindestens 4 Stämme haben
  min-logs-rooted: 4

  # Mindestanzahl isolierter Stämme (nicht am Boden) für einen virtuellen Stamm.
  # Ermöglicht die Behandlung kleiner schwebender Gruppen als Mini-Bäume.
  # Beispiel: 3 → ein Cluster von 3+ schwebenden Stämmen wird als Baum behandelt
  min-logs-isolated: 3

  # Maximale Dicke (in Stämmen) eines Engpasses zwischen zwei Teilbäumen.
  # Wenn eine Verbindungssektion mehr Stämme hat, wird nicht getrennt.
  # Beispiel: 4 → eine Verbindung von ≤ 4 Stämmen ist ein trennbarer Engpass
  max-bridge-section-size: 4

  # Maximale Kosten (höhengewichtet) eines zulässigen Engpasses.
  # Je höher und breiter eine Verbindung, desto höher ihre Kosten.
  max-bridge-cost: 20.0

  # Höhengewichtungskoeffizient für Schnitte.
  # Beispiel: 0.1 → leichter Vorteil für hohe Schnitte
  height-weight-alpha: 0.1

  # Maximaler Radius um den Zielstamm für Verbindungssuche zwischen Bäumen.
  bridge-search-radius: 16

# ─────────────────────────────────────────────────────────────────────────────
# Performance (progressives Fällen für sehr große Bäume)
# ─────────────────────────────────────────────────────────────────────────────
performance:
  # true = stufenweises Fällen für große Bäume aktivieren
  staged-cut-enabled: true

  # Über dieser Gesamtblockanzahl (Stämme + Blätter) in mehreren Durchgängen fällen.
  # Beispiel: 256 → Bäume über 256 Blöcke werden progressiv gefällt
  staged-cut-min-blocks: 256

  # Höhe (in Blöcken) einer pro Schritt zerstörten Scheibe.
  # Beispiel: 1 → 1 Y-Ebene pro Durchgang
  staged-cut-slice-height: 1

  # Verzögerung zwischen jeder Scheibe (in Server-Ticks, 20 Ticks = 1 Sekunde).
  # Beispiel: 5 → 1 Scheibe alle 5 Ticks
  staged-cut-interval-ticks: 5

# ─────────────────────────────────────────────────────────────────────────────
# Unterirdisches Wurzelauffüllen
# ─────────────────────────────────────────────────────────────────────────────
roots:
  # true = unterirdische Stämme durch einen festen Block ersetzen statt Luft.
  backfill-enabled: true

  # Standardblock wenn kein fester Nachbar gefunden wird.
  backfill-block: "DIRT"

  # Auffüllmodus: HOLE_DETECTOR (empfohlen), LEGACY (original), oder NONE
  fill-mode: "HOLE_DETECTOR"

  # Maximale Scan- und Auffülltiefe
  fill-depth: 16

  # Zusätzliche horizontale Blöcke um die XZ-Begrenzungsbox
  fill-radius-extra: 0

  # Natürlicher Bodenspreizfaktor im Zentrum (Elefantenfuß)
  elephant-factor: 1.5

  # Maximale erlaubte Neigung zwischen benachbarten Säulen beim Glätten (in Blöcken)
  # Kleinerer Wert = flachere Oberfläche
  max-slope: 2

  # Anzahl der Nachbarn für IDW-Interpolation (empfohlen: 8)
  idw-neighbors: 8

  # [LEGACY] Maximale Auffülltiefe (in Blöcken unter der Oberfläche).
  max-backfill-depth: 6

  # [LEGACY] XZ-Blöcke über den Stamm hinaus für den Flutfüll-Bereich
  root-fill-padding: 2

  # [LEGACY] Zusätzliche Tiefenmarge unter dem tiefsten geschnittenen Stamm
  root-fill-depth-padding: 2

# ─────────────────────────────────────────────────────────────────────────────
# Zylindrischer Fallback-Algorithmus (Fallback-Erkennungsmodul)
# ─────────────────────────────────────────────────────────────────────────────
fallback:
  # true = zylindrischen Fallback aktivieren wenn die Hauptmethode fehlschlägt
  enabled: true

  # Maximale Blockanzahl für die Fallback-Anwendung.
  # Darüber hinaus wird massives Fällen verweigert.
  max-blocks: 2048

  # Horizontaler Radius für die Suche nach Hauptstammsäulen.
  # Beispiel: 1 → Säulen unmittelbar neben dem getroffenen Stamm
  trunk-core-radius: 1

  # Minimale aufeinanderfolgende vertikale Stämme für eine Stammsäule.
  trunk-min-height: 3

  # Maximaler horizontaler Radius im Fallback-Modus.
  # Beispiel: 8 → Zylinder mit Radius 8 um den Stamm
  max-radius: 8

  # Minimale Dichte (0.0 bis 1.0) um einen Ring einzuschließen.
  # Wenn die Ringdichte unter diesen Schwellwert fällt, stoppt die Erweiterung.
  # Beispiel: 0.10 → mindestens 10% Baumblöcke
  min-density: 0.10

  # Breite der Distanzringe (in Blöcken).
  ring-step: 1

# ─────────────────────────────────────────────────────────────────────────────
# Drops aus entfernten Blättern
# ─────────────────────────────────────────────────────────────────────────────
leaf-drops:
  enabled: true          # Blatt-Drops aktivieren/deaktivieren
  sapling-chance: 0.05   # 5% pro Blatt (NICHT ÄNDERN)
  stick-chance: 0.02     # 2% pro Blatt (NICHT ÄNDERN)
  apple-chance: 0.005    # 0.5% (Eiche + dunkler Wald nur) (NICHT ÄNDERN)
