# ─────────────────────────────────────────────────────────────────────────────
# config.yml — Configuration Principale de WildTimber
# ─────────────────────────────────────────────────────────────────────────────
#
# APERÇU DES MODULES DE DÉTECTION :
# WildTimber utilise 3 modules complémentaires pour gérer les arbres :
#
# 1. MODULE PRINCIPAL (BFS 26-way + Goulots) :
#    Analyse le tronc et la canopée en 26-way (diagonales incluses, idéal pour les
#    arbres custom avec branches diagonales). S'il détecte plusieurs troncs, il tente
#    de séparer les arbres fusionnés en coupant de minces jonctions (goulots) selon
#    les critères de taille et coût configurés sous trees.*.
#
# 2. MODULE 6WAY (BFS 6-way) :
#    Si la détection principale (26-way) englobe un cluster trop géant dépassant les
#    limites autorisées (tree_too_large), le plugin relance immédiatement une détection
#    stricte en 6-way. Cela sépare les arbres qui se touchent uniquement par les coins.
#
# 3. MODULE SECOURS (Secours Cylindrique) :
#    Si la séparation par goulots échoue (arbres trop entrelacés), le plugin coupe
#    une portion cylindrique autour du tronc frappé selon la densité locale.
# ─────────────────────────────────────────────────────────────────────────────

plugin:
  enabled: true          # true = plugin actif | false = désactivé globalement
  # Code de langue du plugin (fr, en, de, es, pt_BR, nl, pl, ru, zh_CN, it)
  language: "en"
  # Mettre à true pour afficher les logs de debug dans la console
  debug: false           # Exemple : debug: true -> affiche les scans dans la console
  # Mettre à true pour activer les logs détaillés des drops de feuilles
  verbose-debug: false

worlds:
  # Liste des mondes où WildTimber est désactivé.
  # Si vide, le plugin est actif sur tous les mondes par défaut.
  disabled:
    - "ignored_world_example"

health:
  # Coefficient multiplicateur global des PV des arbres.
  # PV total = somme des poids des bûches * base-coefficient
  # Exemple : 1.0 = normal | 2.0 = arbre deux fois plus résistant
  base-coefficient: 1.0

  # Délai d'inactivité (en secondes) avant le début de la régénération.
  # Exemple : 180 = 3 minutes d'inactivité -> régénération démarre
  inactivity-delay-seconds: 180

  regen:
    # true = les PV se régénèrent si l'arbre n'est pas frappé depuis inactivity-delay-seconds
    enabled: true        # Exemple : false -> l'arbre conserve ses dégâts indéfiniment

    # Pourcentage des PV max récupérés à chaque tick de régénération.
    # Exemple : 10.0 = 10% par palier -> récupération complète en 10 paliers
    percent-per-step: 10.0

    # Intervalle entre chaque tick de régénération, en secondes.
    # Exemple : 60 = 1 palier de régénération toutes les 60 secondes
    step-seconds: 60

  # Active l'affichage visuel de la progression des dégâts sur la bûche ciblée (crack stages)
  visual-tree-health-enabled: true

trigger:
  # Mode de déclenchement. Actuellement seul RIGHT_CLICK_AXE est supporté.
  mode: "RIGHT_CLICK_AXE"

  # true = envoie un message d'aide au joueur qui casse une bûche sans engager l'arbre
  send-hint-message: true   # Exemple : false -> pas de message d'aide

  # Délai (en secondes) entre deux messages d'aide pour le même joueur.
  # Exemple : 60 = un conseil par minute par joueur
  hint-cooldown-seconds: 60

  # Délai minimum entre deux clics comptabilisés (en millisecondes)
  # Exemple : 350 -> un clic toutes les 350ms maximum
  click-cooldown-ms: 350

durability:
  # Dégâts de base infligés à l'arbre par clic selon l'outil utilisé.
  # Clé spéciale AIR (ou HAND) = main nue.
  # Exemple : DIAMOND_AXE: 5.0 -> la hache en diamant inflige 5 PV par clic
  multipliers:
    WOODEN_AXE: 1.0       # Hache en bois
    STONE_AXE: 1.5        # Hache en pierre
    IRON_AXE: 2.0         # Hache en fer
    GOLDEN_AXE: 2.5       # Hache en or
    DIAMOND_AXE: 3.5      # Hache en diamant
    NETHERITE_AXE: 5.0    # Hache en netherite
    AIR: 0.5              # Main nue (HAND -> utilise AIR en interne)

  # Dégâts supplémentaires ajoutés par niveau d'enchantement.
  enchantments:
    # Dégâts bonus par niveau d'Efficacité.
    # Exemple : 0.5 -> Efficacité III ajoute 3 * 0.5 = 1.5 PV bonus
    efficiency: 0.5

    # Dégâts bonus par niveau de Tranchant.
    # Exemple : 0.3 -> Tranchant V ajoute 5 * 0.3 = 1.5 PV bonus
    sharpness: 0.3

  # Multiplicateur d'efficacité interne (réservé pour usage futur).
  efficiency-level-multiplier: 0.2

  extra-loss:
    # true = l'outil perd de la durabilité supplémentaire lors de l'abattage
    enabled: true          # Exemple : false -> pas d'usure extra

    # Points de durabilité supplémentaires perdus par coup.
    # Exemple : 1 = 1 point de durabilité extra perdu par clic
    points-per-interval: 1

    # Pourcentage de chance (0-100) de perdre de la durabilité extra par coup.
    # Exemple : 50 = 50% de chance de perdre des points d'usure
    chance-percent: 100

limits:
  # Preset de détection d'arbre :
  # - CUSTOM  : Utilise toutes les règles, limites et critères ci-dessous. (Recommandé)
  # - VANILLA : Ignore les limites ci-dessous et utilise les règles vanilla standard
  preset: "CUSTOM"

  # Détermine si les blocs en blacklist (constructions) empêchent l'abattage.
  # true (défaut) : protège les constructions des joueurs.
  # false : ignore la liste noire de construction lors de l'abattage.
  blacklist-enabled: true

  # true = l'arbre doit être en contact avec le sol (enraciné) pour être abattu.
  # false = les arbres flottants ou non enracinés sont acceptés.
  tree-contact-required: true

  # Nombre maximal de bûches dans un arbre avant d'être considéré comme trop grand.
  # Exemple : 1024 -> refuse de traiter un arbre ayant plus de 1024 bûches
  max-logs: 1024

  # Nombre total maximal de blocs (bûches + feuilles) dans un arbre.
  # Exemple : 4096 -> limite globale de 4096 blocs par arbre
  max-blocks: 4096

  # Rayon horizontal maximal (XZ, en blocs) du scan à partir du tronc.
  # Exemple : 16 -> cherche des bûches jusqu'à 16 blocs de distance horizontale
  max-radius-xz: 16

  # Hauteur verticale maximale (Y, en blocs) du scan à partir du bloc cliqué.
  # Doit généralement être plus grand que max-radius-xz.
  # Exemple : 64 -> cherche des bûches jusqu'à 64 blocs de hauteur
  max-height-y: 64

  # Nombre maximal de blocs non-arbre connectés tolérés.
  max-connected-non-tree-blocks: 50

  # Distance maximale de propagation BFS pour la détection et le decay des feuilles.
  # - leaf-decay-range-xz : distance horizontale maximale (XZ) du scan de feuilles.
  # - leaf-decay-range-y  : distance verticale maximale (Y) du scan de feuilles.
  # Exemple : xz: 6, y: 8 -> cherche les feuilles jusqu'à 6 blocs horiz. et 8 vert.
  leaf-decay-range-xz: 6
  leaf-decay-range-y: 8

  # Autorise la détection en diagonale (26 directions au lieu de 6 faces orthogonales)
  # - allow-diagonal-logs : connecte les bûches en diagonale (branches fines)
  # - allow-diagonal-leaves : connecte les feuilles en diagonale
  allow-diagonal-logs: true
  allow-diagonal-leaves: true

  # Facteurs d'augmentation dynamique du rayon pour les grands arbres :
  # Toutes les X bûches coupées, ajoute +Y au rayon XZ et +Z au rayon Y.
  # Mettre à 0 ou négatif pour désactiver cette augmentation dynamique.
  leaf-decay-scaling-logs: 100
  leaf-decay-scaling-xz-bonus: 1
  leaf-decay-scaling-y-bonus: 2

  # Blocs considérés comme accessoires/flottants à nettoyer après l'abattage.
  # Exemple : SNOW, HONEYCOMB_BLOCK, HONEY_BLOCK, DARK_OAK_FENCE...
  cleanup-floating-blocks:
    - "SNOW"
    - "HONEYCOMB_BLOCK"
    - "HONEY_BLOCK"
    - "DARK_OAK_FENCE"
    - "DARK_OAK_FENCE_GATE"

  # Multiplicateur de rendement des bûches lors de l'abattage.
  # Bûches dropées = ceil(bûches_totales * log-yield-multiplier)
  # Exemple : 0.75 -> un arbre de 100 bûches donne 75 bûches | 1.0 = rendement total
  log-yield-multiplier: 0.75

  # Nombre d'itérations de recherche de branches dans la canopée.
  # Le plugin cherche itérativement les bûches adjacentes aux feuilles non enracinées.
  # Augmenter si des bûches restent après l'abattage sur de gros arbres custom.
  # Exemple : 5 -> 5 passes de détection de branches (défaut recommandé)
  #          10 -> plus précis pour les arbres très complexes
  max-branch-discovery-iterations: 5

  # Taille maximale (en blocs) d'un cluster orphelin isolé à absorber.
  # Un cluster orphelin est un groupe de bûches/feuilles ne touchant ni sol ni arbre.
  # Si suffisamment petit, il est considéré comme faisant partie de l'arbre.
  # Exemple : 10 -> absorbe les fragments <= 10 blocs | 0 = désactiver
  max-orphan-cluster-size: 10

  # Règle pour les bûches isolées dans la canopée.
  # true = considère ces bûches comme faisant partie de l'arbre principal.
  isolated-logs-rule: true

  # Options pour nettoyer les feuilles solitaires/orphelines autour de l'arbre.
  orphan-leaves-cleanup:
    # true = nettoie automatiquement les feuilles sans bûche proche
    enabled: true
    # Rayon de scan autour de l'arbre abattu pour chercher les feuilles solitaires
    radius: 5

  # Options pour remplacer les racines sous terre (remplace par de la terre au lieu d'air)
  root-replacement:
    # true = active le remplacement des racines sous terre par un bloc solide
    enabled: true
    # Matériau de remplacement (nom Bukkit Material)
    # Exemple : DIRT, COARSE_DIRT, NETHERRACK...
    material: "DIRT"

  # Rayon (en blocs) autour du volume de l'arbre pour chercher les bûches orphelines.
  isolated-logs-radius: 6

  # Nombre maximal de bûches connectées dans un groupe pour être considéré orphelin.
  isolated-log-max: 4

  # true = autorise le joueur à démarrer le scan sur une bûche non enracinée.
  # Le plugin descendra verticalement pour trouver le vrai tronc.
  allow-non-rooted-start: false

  # Profondeur maximale vers le bas pour trouver un tronc enraciné.
  max-root-search-depth: 16

  # Budget max pour le BFS restreint en 6-way (indépendant de max-logs)
  # Permet de couper les arbres géants sans scanner tout leur volume global
  6way-max-logs: 2048

  # Active la phase de nettoyage de la canopée après l'abattage
  canopy-cleanup-enabled: true

  # Marge (blocs) autour de l'arbre pour scanner les feuilles orphelines
  canopy-cleanup-padding: 12

  # Nombre de feuilles traitées par tick pour les mises à jour de persistance (défaut : 64)
  leaves-persistence-batch-size: 64

# ─────────────────────────────────────────────────────────────────────────────
# Anti-cheat
# ─────────────────────────────────────────────────────────────────────────────
anti-cheat:
  # true = active la détection anti-cheat
  enabled: true
  # Délai minimum entre deux clics (en ms) pour casser/interagir avec un arbre
  min-click-interval-ms: 100
  # Changement de vue minimum requis (yaw ou pitch cumulé en degrés) entre les clics
  min-look-change-degrees: 0.1
  # Nombre maximum de clics consécutifs avec un intervalle trop régulier
  max-regular-clicks: 8

# ─────────────────────────────────────────────────────────────────────────────
# Partitionnement multi-sources (séparation des arbres adjacents)
# ─────────────────────────────────────────────────────────────────────────────
trees:
  # Nombre minimum de bûches connectées au sol pour valider un tronc.
  # Exemple : 4 -> un tronc doit avoir au moins 4 bûches pour être reconnu
  min-logs-rooted: 4

  # Nombre minimum de bûches isolées (hors sol) pour créer un tronc virtuel.
  # Permet de traiter les petits groupes flottants comme des mini-arbres.
  # Exemple : 3 -> un groupe de 3+ bûches flottantes est traité comme un arbre
  min-logs-isolated: 3

  # Épaisseur maximale (en bûches) d'un goulot entre deux sous-arbres.
  # Si une jonction a plus de bûches que cette valeur, les arbres ne sont pas séparés.
  # Exemple : 4 -> une connexion de <= 4 bûches est considérée séparable
  max-bridge-section-size: 4

  # Coût maximal (pondéré par la hauteur) d'un goulot admissible.
  # Plus une jonction est haute et large, plus son coût est élevé.
  max-bridge-cost: 20.0

  # Coefficient de pondération de la hauteur pour les coupes.
  # Exemple : 0.1 -> léger avantage aux coupes hautes
  height-weight-alpha: 0.1

  # Rayon maximal autour du tronc ciblé pour chercher les jonctions.
  bridge-search-radius: 16

# ─────────────────────────────────────────────────────────────────────────────
# Performance (coupe progressive pour les très gros arbres)
# ─────────────────────────────────────────────────────────────────────────────
performance:
  # true = active la coupe en plusieurs tranches pour les gros arbres
  staged-cut-enabled: true

  # Au-delà de ce nombre total de blocs (bûches + feuilles), on coupe en plusieurs passes.
  # Exemple : 256 -> les arbres de plus de 256 blocs seront coupés progressivement
  staged-cut-min-blocks: 256

  # Hauteur (en blocs) d'une tranche détruite par étape.
  # Exemple : 1 -> 1 niveau Y coupé par passe
  staged-cut-slice-height: 1

  # Délai entre chaque tranche (en ticks serveur, 20 ticks = 1 seconde).
  # Exemple : 5 -> 1 tranche toutes les 5 ticks (4 par seconde)
  staged-cut-interval-ticks: 5

# ─────────────────────────────────────────────────────────────────────────────
# Rebouchage des racines sous terre
# ─────────────────────────────────────────────────────────────────────────────
roots:
  # true = remplace les bûches sous terre par un bloc solide au lieu d'air.
  backfill-enabled: true

  # Bloc par défaut si aucun voisin solide n'est trouvé.
  backfill-block: "DIRT"

  # Mode de rebouchage : HOLE_DETECTOR (recommandé), LEGACY, ou NONE
  fill-mode: "HOLE_DETECTOR"

  # Profondeur maximale de scan et rebouchage
  fill-depth: 16

  # Nombre de blocs supplémentaires à inclure horizontalement autour du tronc
  fill-radius-extra: 0

  # Facteur d'évasement naturel du sol au centre (Pied d'Éléphant)
  elephant-factor: 1.5

  # Pente maximale autorisée entre colonnes adjacentes lors du lissage
  # Valeur plus basse = surface plus plate
  max-slope: 2

  # Nombre de voisins utilisés pour l'interpolation IDW (recommandé : 8)
  idw-neighbors: 8

  # [LEGACY] Profondeur maximale de rebouchage.
  max-backfill-depth: 6

  # [LEGACY] Marge de blocs XZ au-delà du tronc
  root-fill-padding: 2

  # [LEGACY] Marge de profondeur sous la bûche la plus basse
  root-fill-depth-padding: 2

# ─────────────────────────────────────────────────────────────────────────────
# Algorithme de secours cylindrique (Module de détection Fallback)
# ─────────────────────────────────────────────────────────────────────────────
fallback:
  # true = active l'algorithme de secours cylindrique en cas d'échec de la méthode principale
  enabled: true

  # Nombre maximal de blocs pour lesquels le secours s'applique.
  # Au-delà, l'abattage massif est refusé.
  max-blocks: 2048

  # Rayon horizontal pour chercher les colonnes du tronc principal.
  # Exemple : 1 -> colonnes immédiatement adjacentes au tronc frappé
  trunk-core-radius: 1

  # Nombre minimum de bûches verticales consécutives pour valider un tronc.
  trunk-min-height: 3

  # Rayon horizontal maximal pour l'arbre en mode secours.
  # Exemple : 8 -> cylindre de rayon 8 autour du tronc
  max-radius: 8

  # Densité minimale (0.0 à 1.0) pour inclure un anneau dans l'arbre.
  # Si la densité chute sous ce seuil, l'expansion s'arrête.
  # Exemple : 0.10 -> minimum 10% de blocs d'arbre
  min-density: 0.10

  # Largeur des anneaux de distance (en blocs).
  ring-step: 1

# ─────────────────────────────────────────────────────────────────────────────
# Drops des feuilles retirées
# ─────────────────────────────────────────────────────────────────────────────
leaf-drops:
  enabled: true          # activer/désactiver les drops de feuilles
  sapling-chance: 0.05   # 5% par feuille (NE PAS MODIFIER)
  stick-chance: 0.02     # 2% par feuille (NE PAS MODIFIER)
  apple-chance: 0.005    # 0.5% (chêne + forêt noire uniquement) (NE PAS MODIFIER)
